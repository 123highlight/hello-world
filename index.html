<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>般若日历</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
<script>if(typeof Lunar === 'undefined') document.write('<script src="https://unpkg.com/lunar-javascript/lunar.js"><\/script>');</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 一栏、无卡片：内容靠留白和细线分组。所有颜色都走下面的变量。 */
:root {
  color-scheme: dark;
  --bg: #0E1222;
  --line: #222842;
  --hover: #151A2E;
  --sel: #1A2038;
  --fg: #ECE7DA;
  --mute: #8C92AC;
  --gold: #D9B56C;
  --good: #6CC2AF;
  --bad: #EE9584;
  --calm: #8D93AE;
  --chu: #B9A2E0;
  --wood: #6CC2AF; --fire: #EE9584; --earth: #D9B56C; --metal: #ECE7DA; --water: #86A9E3;
  --serif: 'Noto Serif SC', 'Songti SC', serif;
  --sans: 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
}
/* 浅色：纸白底、墨字，金色加深保证对比度。默认跟随系统，设置里可固定浅/深 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #FBFAF7; --line: #E6E3DA; --hover: #F1EEE6; --sel: #ECE7DB;
    --fg: #1D1F2A; --mute: #767A8A;
    --gold: #9E7420; --good: #2A8571; --bad: #C0503A; --calm: #8A8FA3; --chu: #7A5CB5;
    --wood: #2A8571; --fire: #C0503A; --earth: #9E7420; --metal: #5E6272; --water: #3567BE;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #FBFAF7; --line: #E6E3DA; --hover: #F1EEE6; --sel: #ECE7DB;
  --fg: #1D1F2A; --mute: #767A8A;
  --gold: #9E7420; --good: #2A8571; --bad: #C0503A; --calm: #8A8FA3; --chu: #7A5CB5;
  --wood: #2A8571; --fire: #C0503A; --earth: #9E7420; --metal: #5E6272; --water: #3567BE;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); min-height: 100vh; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { opacity: .3; cursor: default; }
button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.serif { font-family: var(--serif); }
.mute { color: var(--mute); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; }
hr { border: 0; border-top: 1px solid var(--line); }

/* 顶栏 */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar { display: flex; align-items: center; gap: 12px; padding-top: 14px; }
.bar h1 { font: 500 17px var(--serif); letter-spacing: .08em; color: var(--gold); flex: 1; }
.clock { font-variant-numeric: tabular-nums; color: var(--mute); font-size: 13px; }
.ic { width: 32px; height: 32px; display: grid; place-items: center; color: var(--mute); border-radius: 8px; text-decoration: none; }
.ic:hover, .ic[aria-current] { color: var(--fg); background: var(--line); }
nav { display: flex; gap: 18px; padding-top: 10px; overflow-x: auto; scrollbar-width: none; }
nav a { color: var(--mute); text-decoration: none; padding-bottom: 10px; border-bottom: 2px solid transparent; white-space: nowrap; }
nav a[aria-current] { color: var(--fg); border-color: var(--gold); }

main { padding-top: 28px; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
main > section { display: grid; gap: 36px; }

/* 当下 */
.pillars { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
.pillars > div { display: grid; gap: 2px; }
.pillars b { font: 500 40px/1.1 var(--serif); }
.pillars small { color: var(--mute); font-size: 12px; }
.pillars .now small:first-child { color: var(--gold); }
.progress { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--gold); }
.hours { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.hours button { padding: 8px 0; border-radius: 8px; color: var(--mute); }
.hours button:hover { background: var(--line); }
.hours button[aria-pressed="true"] { color: var(--fg); background: var(--line); }
.hours button.cur { color: var(--gold); }
.swatch { width: 18px; height: 18px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px var(--line); }

/* 月份翻页 */
.month { display: flex; align-items: center; justify-content: space-between; }
.month h2 { font: 500 17px var(--serif); }

/* 宜忌 */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; row-gap: 2px; }
.cal .wd { color: var(--mute); font-size: 12px; padding-bottom: 6px; }
.cal button { display: grid; justify-items: center; padding: 6px 0 4px; border-radius: 10px; line-height: 1.2; }
.cal button:hover { background: var(--line); }
.cal button[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--gold); }
.cal b { font-weight: 500; font-variant-numeric: tabular-nums; }
.cal small { font-size: 10px; color: var(--mute); }
.cal .today b { color: var(--gold); }
.cal .hs b { color: var(--bad); }
.dots { display: flex; gap: 3px; height: 5px; margin-top: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.k-ji { --c: var(--good); } .k-hs { --c: var(--bad); } .k-qs { --c: var(--calm); } .k-chu { --c: var(--chu); } .k-tou { --c: var(--gold); }
.chip { color: var(--c, var(--fg)); font-size: 13px; }
.yiji { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.yiji h3, .dirs dt { font: 500 13px var(--sans); color: var(--mute); margin-bottom: 4px; }
.yiji p { line-height: 1.9; }
.dirs { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; gap: 8px; }
.dirs dd { font-family: var(--serif); font-size: 14px; }

/* 星象 */
.moon { display: flex; gap: 14px; align-items: flex-start; }
.moon .glyph { font-size: 40px; line-height: 1; }
.ev { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); }
.ev time { color: var(--mute); font-variant-numeric: tabular-nums; }
.ev.next time { color: var(--gold); }
.ev.past { opacity: .5; }
.ev p { color: var(--mute); font-size: 14px; }
.empty { color: var(--mute); padding-block: 14px; border-top: 1px solid var(--line); }

/* 紫微 */
table { width: 100%; border-collapse: collapse; text-align: center; }
th { font: 500 13px var(--sans); color: var(--mute); padding-bottom: 10px; }
td { padding: 12px 0; border-top: 1px solid var(--line); font-family: var(--serif); font-size: 17px; }
td:first-child { font-family: var(--sans); font-size: 14px; color: var(--mute); text-align: left; }
td small { display: block; font-size: 11px; font-family: var(--sans); color: var(--mute); }
.hua-lu { color: var(--good); } .hua-quan { color: var(--gold); } .hua-ke { color: var(--water); } .hua-ji { color: var(--bad); }

/* 九宫 */
.palace { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.palace button { background: var(--bg); padding: 16px 0 12px; display: grid; gap: 2px; }
.palace button:hover { background: var(--hover); }
.palace button[aria-pressed="true"] { background: var(--sel); }
.palace b { font: 500 26px/1 var(--serif); color: var(--c); }
.palace small { color: var(--mute); font-size: 12px; }
.g-good { --c: var(--good); } .g-bad { --c: var(--bad); } .g-neutral { --c: var(--fg); }
.uses { display: grid; gap: 10px; }
.uses > div { display: grid; grid-template-columns: 56px 1fr; }
.uses dt { color: var(--mute); }
.uses dd button { margin-right: 12px; }
.uses dd button:hover { color: var(--gold); }

/* 随记 */
.moods { display: flex; gap: 6px; font-size: 22px; flex-wrap: wrap; }
.moods button { width: 40px; height: 40px; border-radius: 50%; opacity: .45; }
.moods button[aria-pressed="true"] { opacity: 1; background: var(--line); }
textarea { width: 100%; min-height: 160px; background: none; color: var(--fg); border: 0; resize: vertical; font: 16px/1.8 var(--sans); }
textarea::placeholder { color: var(--mute); opacity: .5; }
.btn { padding: 6px 14px; border-radius: 8px; background: var(--gold); color: var(--bg); font-weight: 500; }
.link { color: var(--mute); font-size: 14px; }
.link:hover { color: var(--fg); }
.entry { padding-block: 14px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.entry p { white-space: pre-wrap; overflow-wrap: anywhere; }

/* 设置 */
.list { display: grid; }
.list > * { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); text-decoration: none; color: var(--fg); width: 100%; text-align: left; }
.list > :first-child { border-top: 0; }
.seg { display: inline-flex; background: var(--line); border-radius: 8px; padding: 2px; }
.seg button { padding: 2px 12px; border-radius: 6px; color: var(--mute); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.danger { color: var(--bad) !important; }
.list > .report { display: block; }
.report { font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
.report .ok { color: var(--good); } .report .no { color: var(--bad); }
.report details { margin-top: 8px; color: var(--mute); }

@media (prefers-reduced-motion: no-preference) { main > section { animation: in .18s ease-out; } @keyframes in { from { opacity: .4 } } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <h1 data-i18n="appTitle">般若日历</h1>
      <span class="clock" id="clock"></span>
      <a class="ic" href="#diary" data-i18n-label="tabDiary" aria-label="随记"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></a>
      <a class="ic" href="#settings" data-i18n-label="tabSettings" aria-label="设置"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></a>
    </div>
    <nav>
      <a href="#now" data-i18n="tabBazi">当下</a>
      <a href="#yiji" data-i18n="tabCalendar">宜忌</a>
      <a href="#astro" data-i18n="tabAstro">星象</a>
      <a href="#ziwei" data-i18n="tabZiwei">紫微</a>
      <a href="#jiugong" data-i18n="tabJiugong">九宫</a>
    </nav>
  </div>
</header>

<main class="wrap">

<section id="now">
  <div class="pillars" id="bazi-pillars"></div>
  <div class="progress"><i id="shichen-fill"></i></div>
  <div class="hours" id="shichen-grid"></div>
  <p id="shichen-meaning"></p>
  <hr>
  <div class="stack" id="lucky-color-display"></div>
  <p id="wuxing-display"></p>
</section>

<section id="yiji" hidden>
  <div class="stack">
    <div class="month">
      <button class="ic" onclick="calNav(-1)" data-i18n-label="prevMonth" aria-label="上个月">‹</button>
      <h2 id="cal-title"></h2>
      <button class="ic" onclick="calNav(1)" data-i18n-label="nextMonth" aria-label="下个月">›</button>
    </div>
    <div class="cal" id="cal-grid"></div>
  </div>
  <div class="stack" style="gap:20px" id="day-detail"></div>
</section>

<section id="astro" hidden>
  <div class="moon" id="moon-phase-display"></div>
  <div class="stack" style="gap:8px">
    <div class="month">
      <button class="ic" id="astro-prev" onclick="astroNav(-1)" data-i18n-label="prevMonth" aria-label="上个月">‹</button>
      <h2 id="astro-title"></h2>
      <button class="ic" id="astro-next" onclick="astroNav(1)" data-i18n-label="nextMonth" aria-label="下个月">›</button>
    </div>
    <div id="planet-list"></div>
  </div>
</section>

<section id="ziwei" hidden>
  <table><thead id="ziwei-head"></thead><tbody id="ziwei-body"></tbody></table>
</section>

<section id="jiugong" hidden>
  <div class="palace" id="jiugong-grid"></div>
  <div class="stack" style="gap:4px" id="star-detail"></div>
  <dl class="uses" id="liuyue-display"></dl>
</section>

<section id="diary" hidden>
  <div class="stack">
    <div><h2 class="serif" style="font-weight:500;font-size:17px" id="diary-date"></h2><div class="mute small" id="diary-sub"></div></div>
    <div class="moods" id="mood-row"></div>
    <textarea id="diary-input" data-i18n-placeholder="diaryPlaceholder" placeholder="今天…"></textarea>
    <div class="row">
      <button class="btn" onclick="saveDiary()" data-i18n="saveDiary">保存</button>
      <span style="flex:1"></span>
      <button class="link" onclick="sendToObsidian()" data-i18n="obsidianBtn">Obsidian</button>
      <button class="link" onclick="exportDiary()" data-i18n="exportTxt">导出</button>
    </div>
  </div>
  <div id="diary-list"></div>
</section>

<section id="settings" hidden>
  <div class="list">
    <div><span data-i18n="language">语言</span><span class="seg"><button data-lang="zh" onclick="switchLang('zh')">中</button><button data-lang="en" onclick="switchLang('en')">EN</button></span></div>
    <div><span data-i18n="theme">外观</span><span class="seg"><button data-theme-opt="auto" onclick="setTheme('auto')" data-i18n="themeAuto">自动</button><button data-theme-opt="light" onclick="setTheme('light')" data-i18n="themeLight">浅</button><button data-theme-opt="dark" onclick="setTheme('dark')" data-i18n="themeDark">深</button></span></div>
    <div><span data-i18n="currentTz">时区</span><span class="mute" id="tz-info"></span></div>
  </div>
  <div class="list">
    <button onclick="exportDiary()"><span data-i18n="dataExport">导出随记</span><span class="mute">TXT</span></button>
    <button onclick="diagnoseDiary()"><span data-i18n="checkLegacy">检查旧版随记</span><span class="mute">›</span></button>
    <div class="report" id="diagnose-result" hidden></div>
    <button class="danger" onclick="clearData()" data-i18n="clearData">清除所有随记</button>
  </div>
  <div class="list">
    <a href="https://diy-ew42.vercel.app/" target="_blank" rel="noopener"><span data-i18n="homeFengshui">家居风水自查</span><span class="mute">↗</span></a>
  </div>
  <p class="mute small">v2.1</p>
</section>

</main>

function t(key) {
  const entry = I18N[key];
  if (!entry) return key;
  return entry[currentLang] ?? entry.zh ?? key;
}

// Apply static UI translations (HTML elements with data-i18n*)
function applyStaticI18n() {
  document.documentElement.lang = (currentLang === 'zh') ? 'zh-CN' : 'en';
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-label]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nLabel)); });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === currentLang));
}

// Switch language and re-render everything
function switchLang(lang) {
  if (lang !== 'zh' && lang !== 'en') return;
  currentLang = lang;
  try { localStorage.setItem('panna_lang', lang); } catch(e) {}
  applyStaticI18n();
  // Re-render all dynamic content
  if (typeof Lunar !== 'undefined') {
    renderBazi();
    renderAstrology();
    renderCalendar();
    renderJiugong();
    renderZiwei();
    initDiary();
  }
}

// 外观：auto 跟随系统；light / dark 固定并记住
function setTheme(mode) {
  const root = document.documentElement;
  if (mode === 'light' || mode === 'dark') root.dataset.theme = mode; else delete root.dataset.theme;
  try { mode === 'light' || mode === 'dark' ? localStorage.setItem('panna_theme', mode) : localStorage.removeItem('panna_theme'); } catch(e) {}
  syncTheme();
}
function syncTheme() {
  const mode = document.documentElement.dataset.theme || 'auto';
  document.querySelectorAll('[data-theme-opt]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeOpt === mode));
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.body).backgroundColor;
}
matchMedia('(prefers-color-scheme: light)').addEventListener('change', syncTheme);

// ===== TIMEZONE DETECTION =====
function detectTimezone() {
  userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  userOffset = -(new Date().getTimezoneOffset());
  const h = Math.floor(Math.abs(userOffset) / 60), m = Math.abs(userOffset) % 60;
  const tzStr = `UTC${userOffset >= 0 ? '+' : '-'}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.getElementById('tz-info').textContent = `${userTimezone} · ${tzStr}`;
}

// ===== BAZI CALCULATION =====
function getBaziForDate(date) {
  // 年月日干支全部来自 lunar-javascript，保证与日历页数据一致
  const l = Lunar.fromDate(date);
  const hour = date.getHours();

  // 年柱
  const yearGZ = l.getYearInGanZhi();
  const yearTG = yearGZ[0];
  const yearDZ = yearGZ[1];

  // 月柱（lunar-javascript 按节气准确计算）
  const monthGZ = l.getMonthInGanZhi();
  const monthTG = monthGZ[0];
  const monthDZ = monthGZ[1];

  // 日柱
  const dayGZ = l.getDayInGanZhi();
  const dayTG = dayGZ[0];
  const dayDZ = dayGZ[1];

  // 时柱（根据日干推时干）
  const shichenIdx = getShichenIdx(hour);

  return {
    year:  { tg: yearTG,  dz: yearDZ  },
    month: { tg: monthTG, dz: monthDZ },
    day:   { tg: dayTG,   dz: dayDZ   },
    hour:  hourPillar(dayTG, shichenIdx),
    shichenIdx
  };
}

// 五鼠遁：日干定子时天干
function hourPillar(dayTG, idx) {
  const start = [0, 2, 4, 6, 8][TIANGAN.indexOf(dayTG) % 5];
  return { tg: TIANGAN[(start + idx) % 10], dz: DIZHI[idx] };
}

// 当下页点选的时辰；null = 跟随当前时间
let selectedShichen = null;
function pickShichen(idx) {
  selectedShichen = idx;
  renderBazi();
}

function getShichenIdx(hour) {
  if (hour === 23 || hour === 0) return 0; // 子时
  return Math.floor((hour + 1) / 2);
}

function getShichenProgress(hour, minute) {
  const idx = getShichenIdx(hour);
  let startH, endH;
  if (idx === 0) {
    // 子时跨午夜
    const realHour = hour === 23 ? hour : hour + 24;
    const startHour = 23;
    const totalMin = 2 * 60;
    const elapsedMin = (realHour - startHour) * 60 + minute;
    return { pct: Math.round(elapsedMin / totalMin * 100), idx };
  }
  startH = idx * 2 - 1;
  const totalMin = 2 * 60;
  const elapsedMin = (hour - startH) * 60 + minute;
  return { pct: Math.round(Math.min(elapsedMin / totalMin * 100, 100)), idx };
}

function renderBazi() {
  if (typeof Lunar === 'undefined') return;
  const now = new Date();
  const bazi = getBaziForDate(now);
  const nowIdx = bazi.shichenIdx;
  if (selectedShichen === nowIdx) selectedShichen = null;
  const sel = selectedShichen ?? nowIdx;
  bazi.hour = hourPillar(bazi.day.tg, sel);
  const EN = currentLang === 'en';
  const labels = t('pillarShort');

  // 四柱：天干按五行上色，柱下写天干五行；时柱标题就是时辰名，金色 = 当下
  document.getElementById('bazi-pillars').innerHTML = [bazi.year, bazi.month, bazi.day, bazi.hour].map((p, i) => {
    const wx = WUXING_TG[TIANGAN.indexOf(p.tg)];
    const title = i === 3 ? (EN ? SHICHEN_EN[sel] : SHICHEN_NAMES[sel]) : labels[i];
    const en = EN ? `<small>${TG_EN[p.tg] || ''} · ${(DZ_EN[p.dz] || '').split(' ')[0]}</small>` : '';
    return `<div class="${i === 3 && sel === nowIdx ? 'now' : ''}">
      <small>${title}</small><b style="color:var(--${WX_VAR[wx]})">${p.tg}</b><b>${p.dz}</b>
      <small title="${getWuxingTip(wx)}">${wuxingName(wx)}</small>${en}</div>`;
  }).join('');

  const prog = getShichenProgress(now.getHours(), now.getMinutes());
  const fill = document.getElementById('shichen-fill');
  fill.style.width = prog.pct + '%';
  fill.parentNode.title = `${shichenName(nowIdx)} ${prog.pct}%`;

  // 十二时辰：金字 = 当下，底色 = 选中；再点当下回到当下
  document.getElementById('shichen-grid').innerHTML = SHICHEN_NAMES.map((name, i) =>
    `<button class="${i === nowIdx ? 'cur' : ''}" aria-pressed="${i === sel}" onclick="pickShichen(${i})" title="${getShichenTimeStr(i)}">${EN ? SHICHEN_EN[i] : name[0]}</button>`
  ).join('');

  const meaning = SHICHEN_MEANING[SHICHEN_NAMES[sel]] || {};

}

}

const AstroDB = { ...AstroDB2026, ...AstroDB2027, ...AstroDB2028, ...AstroDB2029, ...AstroDB2030 };

let astroView = null; // 星象页正在查看的月份 {y, m}
const ASTRO_MIN = 2026, ASTRO_MAX = 2030;
function astroNav(dir) {
  const now = new Date();
  let { y, m } = astroView || { y: now.getFullYear(), m: now.getMonth() + 1 };
  m += dir;
  if (m > 12) { m = 1; y++; }
  if (m < 1) { m = 12; y--; }
  if (y < ASTRO_MIN || y > ASTRO_MAX) return;
  astroView = { y, m };
  renderAstrology();
}

function renderAstrology() {
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth() + 1, day = now.getDate();
  const EN = currentLang === 'en';
  const pick = (obj) => obj ? (obj[currentLang] || obj.zh) : '';

  // 查看的月份：默认当前月，今天超出数据范围时取边界月
  if (!astroView) astroView = year < ASTRO_MIN ? { y: ASTRO_MIN, m: 1 } : year > ASTRO_MAX ? { y: ASTRO_MAX, m: 12 } : { y: year, m: month };
  const { y: vy, m: vm } = astroView;

  document.getElementById('astro-title').textContent = EN ? `${I18N.monthsShort.en[vm - 1]} ${vy}` : `${vy}年${vm}月`;
  document.getElementById('astro-prev').disabled = vy === ASTRO_MIN && vm === 1;
  document.getElementById('astro-next').disabled = vy === ASTRO_MAX && vm === 12;

  // 今天或之后的第一个事件，日期标金色（取代原来的顶部横幅）
  const today0 = new Date(year, month - 1, day);
  const monthEvts = AstroDB[`${vy}-${vm}`] || [];
  const next = monthEvts.find(e => new Date(vy, vm - 1, e.d) >= today0);
  document.getElementById('planet-list').innerHTML = monthEvts.length
    ? monthEvts.map(e => {
        const past = new Date(vy, vm - 1, e.d) < today0;
        return `<div class="ev${past ? ' past' : ''}${e === next ? ' next' : ''}">
          <time>${EN ? I18N.monthsShort.en[vm - 1] + ' ' + e.d : vm + '/' + e.d}</time>
          <div><div>${pick(e.t)}</div><p>${pick(e.tip)}</p></div></div>`;
      }).join('')
    : `<div class="empty">${t('monthPeaceful')}</div>`;

  renderMoonPhase(now);
}

// 红煞日：节气月(寅月=1…丑月=12)孟月(1,4,7,10)逢酉、仲月(2,5,8,11)逢巳、季月(3,6,9,12)逢丑
// 节气月不分闰月，天然按同月处理
// ponytail: 只标到 HONGSHA_UNTIL_YEAR（阳历年），要延长改这个数
const HONGSHA_UNTIL_YEAR = 2030;
const ZHI12 = '子丑寅卯辰巳午未申酉戌亥';
function isHongSha(l, solarYear) {
  if (solarYear > HONGSHA_UNTIL_YEAR) return false;
  const m = (ZHI12.indexOf(l.getMonthZhi()) + 10) % 12 + 1;
  return l.getDayZhi() === ['酉', '巳', '丑'][(m + 2) % 3];
}

// 金神七煞日：甲己年午未、乙庚年辰巳、丙辛年子丑寅卯、丁壬年戌亥、戊癸年申酉（年干按立春换年）
const JINSHEN_ZHI = { '甲':'午未', '己':'午未', '乙':'辰巳', '庚':'辰巳', '丙':'子丑寅卯', '辛':'子丑寅卯',
                      '丁':'戌亥', '壬':'戌亥', '戊':'申酉', '癸':'申酉' };
function isJinShen(l) {
  return JINSHEN_ZHI[l.getYearGanByLiChun()].includes(l.getDayZhi());
}

// 煞贡、直星、人专三吉星（金符九星）：按节气月分孟(1,4,7,10)/仲(2,5,8,11)/季(3,6,9,12)月，每项为日干支
// 依据《九天上圣秘传金符经》逐日表核对（九星 9 日一循环，三个月型分别从甲子日的妖星/或星/禾刀起算）
const SANJI = [
  [ // 孟月
    '丁卯丙子乙酉甲午癸卯壬子辛酉', '戊辰丁丑丙戌乙未甲辰癸丑壬戌', '辛未庚辰己丑戊戌丁未丙辰'],
  [ // 仲月
    '丙寅乙亥甲申癸巳壬寅辛亥庚申', '丁卯丙子乙酉甲午癸卯壬子辛酉', '庚午己卯戊子丁酉丙午乙卯'],
  [ // 季月
    '乙丑甲戌癸未壬辰辛丑庚戌己未', '丙寅乙亥甲申癸巳壬寅辛亥庚申', '己巳戊寅丁亥丙申乙巳甲寅癸亥'],
].map(t => t.join(''));
// 大偷修日（凶神朝天）：这 8 个干支日
const DA_TOUXIU = '壬子癸丑丙辰丁巳戊午己未庚申辛酉';

// 杨公十三忌日（农历月 → 日）
const YANGGONG = {1:[13], 2:[11], 3:[9], 4:[7], 5:[5], 6:[3], 7:[1, 29], 8:[27], 9:[25], 10:[23], 11:[21], 12:[19]};
function isYangGong(l) { return YANGGONG[Math.abs(l.getMonth())].includes(l.getDay()); }

// 吉日 = 三吉星日；其中属大偷修的标"偷修"；红煞日/金神七煞日/杨公忌日一律不标
function dayLabel(l, solarYear) {
  if (solarYear > HONGSHA_UNTIL_YEAR || isHongSha(l, solarYear) || isJinShen(l) || isYangGong(l)) return '';
  const m = (ZHI12.indexOf(l.getMonthZhi()) + 10) % 12 + 1;
  const gz = l.getDayInGanZhi();
  if (!SANJI[[2, 0, 1][m % 3]].includes(gz)) return '';
  return DA_TOUXIU.includes(gz) ? '偷修' : '吉';
}

let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

let calSel = new Date();
function renderCalendar() {
  const now = new Date();
  const EN = currentLang === 'en';
  document.getElementById('cal-title').textContent = EN
    ? `${I18N.monthsShort.en[calMonth]} ${calYear}`
    : `${calYear}年${calMonth + 1}月`;

  const weekdays = I18N.weekdaysShort[currentLang] || I18N.weekdaysShort.zh;
  const startDow = (new Date(calYear, calMonth, 1).getDay() + 6) % 7; // 周一开始
  const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
  let html = weekdays.map(w => `<span class="wd">${w}</span>`).join('') + '<span></span>'.repeat(startDow);
  for (let i = 1; i <= lastDate; i++) {
    const d = new Date(calYear, calMonth, i);
    const l = Lunar.fromDate(d);
    // 农历：初一显示月份；节气、三字以内的节日优先
    let sub = l.getDayInChinese();
    if (sub === '初一') sub = l.getMonthInChinese() + '月';
    const jq = l.getJieQi(), fs = l.getFestivals();
    if (jq) sub = jq; else if (fs.length && fs[0].length <= 3) sub = fs[0];
    const cls = (d.toDateString() === now.toDateString() ? 'today ' : '') + (isHongSha(l, calYear) ? 'hs' : '');
    html += `<button class="${cls}" aria-pressed="${d.toDateString() === calSel.toDateString()}" onclick="pickDay(${i})">
      <b>${i}</b><small>${sub}</small><span class="dots">${dayMarks(l, calYear).map(m => `<i class="k-${m.k}"></i>`).join('')}</span></button>`;
  }
  document.getElementById('cal-grid').innerHTML = html;
  renderDailyDetail(calSel);
}

function pickDay(i) {
  calSel = new Date(calYear, calMonth, i);
  renderCalendar();
}

// 一天的标记：圆点和详情里的文字同色，详情就是图例
function dayMarks(l, solarYear) {
  const EN = currentLang === 'en';
  const marks = [];
  const label = dayLabel(l, solarYear);
  if (label) marks.push({ k: label === '偷修' ? 'tou' : 'ji', t: EN ? JIRI_EN[label] : label });
  if (isHongSha(l, solarYear)) marks.push({ k: 'hs', t: EN ? 'Red Sha' : '红煞' });
  if (isJinShen(l)) marks.push({ k: 'qs', t: EN ? 'Qisha' : '七煞' });
  if (l.getZhiXing() === '除') marks.push({ k: 'chu', t: jianchuLabel('除') });
  return marks;
}

function renderDailyDetail(date) {
  if (typeof Lunar === 'undefined') return;
  const l = Lunar.fromDate(date);
  // 库里的传统写法 → 现代说法；诸事不宜、"忌：无"照实显示
  const MODERN_ALIAS = { '会亲友': '会友', '立券': '签约', '修造': '装修', '移徙': '搬家' };
  const pickYiJi = (list) => {
    const all = list.map(x => MODERN_ALIAS[x] || x);
    const special = ['诸事不宜', '无'].filter(x => all.includes(x));
    return special.concat(all.filter(x => ModernEvents.includes(x)));
  };
  const words = (list) => (list.length ? list : ['平']).map(yiJiLabel).join('　');
  const zx = l.getZhiXing();
  const marks = dayMarks(l, date.getFullYear()).filter(m => m.k !== 'chu');
  const [yiH, jiH] = t('yiJiHead');
  const dirH = t('dirHead');
  const dirs = [mapDir(l.getDayPositionCai()), mapDir(l.getDayPositionXi()), mapDir(l.getDayPositionFu(1)),
                `${l.getDayChongGan()}${l.getDayChong()}${currentLang === 'en' ? ' ' + SHENGXIAO_EN[l.getDayChongShengXiao()] : l.getDayChongShengXiao()} · ${mapDir(l.getDaySha())}`];
  document.getElementById('day-detail').innerHTML = `
    <div class="row between">
      <span class="serif" style="font-size:17px">${l.getYearInGanZhi()} ${l.getMonthInGanZhi()} ${l.getDayInGanZhi()}</span>
      <span class="row" style="gap:10px">${marks.map(m => `<span class="chip k-${m.k}">${m.t}</span>`).join('')}<span class="chip ${zx === '除' ? 'k-chu' : ''}">${jianchuLabel(zx)}</span></span>
    </div>
    <div class="yiji"><div><h3>${yiH}</h3><p>${words(pickYiJi(l.getDayYi()))}</p></div><div><h3>${jiH}</h3><p>${words(pickYiJi(l.getDayJi()))}</p></div></div>
    <dl class="dirs">${dirs.map((v, i) => `<div><dt>${dirH[i]}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

// ===== JIUGONG =====
// 月盘入中数规则：4月=6，每月递减1，到1后循环回9
// 洛书顺飞路径：中→乾(西北)→兑(正西)→艮(东北)→离(正南)→坎(正北)→坤(西南)→震(正东)→巽(东南)



function getMonthCenter(monthDZ) {
  // 以节气月地支推入中数
  // 锚点：壬辰月（辰月）= 6白入中
  // 地支顺序：寅卯辰巳午未申酉戌亥子丑，对应月序1-12
  // 辰月=3，锚点入中=6，每月减1
  const DZ_ORDER = ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];
  const anchorDZIdx = 2; // 辰 = index 2
  const anchorCenter = 6;
  const idx = DZ_ORDER.indexOf(monthDZ);
  if (idx === -1) return 6; // 兜底
  const diff = idx - anchorDZIdx;
  let center = ((anchorCenter - 1 - diff) % 9 + 9) % 9 + 1;
  return center;
}

function renderJiugong() {
  if (typeof Lunar === 'undefined') return;
  const now = new Date();
  const l = Lunar.fromDate(now);

  // 取节气月地支（与月柱一致，按节气换月）
  const monthGZ = l.getMonthInGanZhi();
  const monthDZ = monthGZ[1];
  const center = getMonthCenter(monthDZ);

  // 洛书顺飞：中、乾、兑、艮、离、坎、坤、震、巽
  const flyOrder = ['中', '西北', '正西', '东北', '正南', '正北', '西南', '正东', '东南'];
  const starMap = {};
  flyOrder.forEach((pos, i) => {
    const num = ((center - 1 + i) % 9) + 1;
    starMap[pos] = num;
  });

  jiugongState = { starMap, monthGZ };
  if (!jiugongSel) jiugongSel = starMap['中'];
  renderPalace();
}

let jiugongState = null, jiugongSel = null;
function pickStar(num) { jiugongSel = num; renderPalace(); }

  const displayOrder = ['东南','正南','西南','正东','中','正西','东北','正北','西北'];
  const posOf = {};
  Object.entries(starMap).forEach(([pos, num]) => { posOf[num] = pos; });
  const where = (num) => posOf[num] === '中' ? t('zhonggong') : dirName(posOf[num]);
  const pick = (o) => o[currentLang] || o.zh;

  document.getElementById('jiugong-grid').innerHTML = displayOrder.map(pos => {
    const num = starMap[pos];
    return `<button class="g-${FLYSTAR_GUIDE[num].type}" aria-pressed="${num === jiugongSel}" onclick="pickStar(${num})"><b>${num}</b><small>${where(num)}</small></button>`;

    `<div><dt>${heads[i]}</dt><dd>${stars.map(n => `<button onclick="pickStar(${n})">${where(n)}</button>`).join('')}</dd></div>`
  ).join('');
}

  const migrated = [...existing];
  let count = 0;

  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('panna_j_')) {
      const dateStr = k.replace('panna_j_', ''); // 格式如 2024-12-25
      const text = localStorage.getItem(k);
      if (!text || !text.trim()) continue;

      // 用日期当 ID 避免重复迁移
      const id = `legacy_${dateStr}`;
      if (existingIds.has(id)) continue;

      // 解析日期
      const [y, m, d] = dateStr.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      const dateLabel = date.toLocaleDateString(localeStr(), { year:'numeric', month:'long', day:'numeric' });

      let baziLabel = '';
      if (typeof Lunar !== 'undefined') {
        try {
          const l = Lunar.fromDate(date);
          baziLabel = `${l.getDayInGanZhi()} (${t('legacyImportTag')})`;
        } catch(e) {}
      }

      migrated.push({
        id,
        date: dateLabel,
        time: '',
        bazi: baziLabel,
        mood: '📖',
        text
      });
      count++;
    }
  }

  if (count > 0) {
    // 按日期降序
    migrated.sort((a, b) => {
      const da = new Date(a.date.replace(/年|月/g,'-').replace('日',''));
      const db = new Date(b.date.replace(/年|月/g,'-').replace('日',''));
      return db - da;
    });
    localStorage.setItem('diary_entries', JSON.stringify(migrated));
    console.log(`成功迁移 ${count} 条原版日记`);
  }

  return migrated;
}

let diaryEntries = migrateLegacyDiary();

const MOODS = ['😊','😌','😔','😤','🤔','😴','🥰'];
function initDiary() {
  const now = new Date();
  document.getElementById('diary-date').textContent =
    now.toLocaleDateString(localeStr(), { month:'long', day:'numeric', weekday:'short' });
  const bazi = getBaziForDate(now);
  document.getElementById('diary-sub').textContent = currentLang === 'en'
    ? `Y ${bazi.year.tg}${bazi.year.dz} · M ${bazi.month.tg}${bazi.month.dz} · D ${bazi.day.tg}${bazi.day.dz} · H ${bazi.hour.tg}${bazi.hour.dz}`
    : `${bazi.year.tg}${bazi.year.dz}年 · ${bazi.month.tg}${bazi.month.dz}月 · ${bazi.day.tg}${bazi.day.dz}日 · ${bazi.hour.tg}${bazi.hour.dz}时`;
  const names = t('moods');
  document.getElementById('mood-row').innerHTML = MOODS.map((m, i) =>
    `<button aria-pressed="${m === selectedMood}" aria-label="${names[i]}" title="${names[i]}" onclick="selectMood('${m}')">${m}</button>`).join('');
  renderDiaryList();
}

function selectMood(emoji) {
  selectedMood = selectedMood === emoji ? '' : emoji;
  document.querySelectorAll('#mood-row button').forEach((b, i) => b.setAttribute('aria-pressed', MOODS[i] === selectedMood));
}

function saveDiary() {
  const text = document.getElementById('diary-input').value.trim();
  if (!text) { alert(t('alertWriteFirst')); return; }
  const now = new Date();
  const bazi = getBaziForDate(now);
  const EN = currentLang === 'en';
  const entry = {
    id: Date.now(),
    date: now.toLocaleDateString(localeStr(), { year:'numeric', month:'long', day:'numeric' }),
    time: now.toLocaleTimeString(localeStr(), { hour:'2-digit', minute:'2-digit' }),
    bazi: EN
      ? `D ${bazi.day.tg}${bazi.day.dz} · H ${bazi.hour.tg}${bazi.hour.dz}`
      : `${bazi.day.tg}${bazi.day.dz}日 · ${bazi.hour.tg}${bazi.hour.dz}时`,
    mood: selectedMood || '📝',
    text
  };
  diaryEntries.unshift(entry);
  try { localStorage.setItem('diary_entries', JSON.stringify(diaryEntries)); }
  catch(e) { diaryEntries.shift(); alert(e.message); return; }
  document.getElementById('diary-input').value = '';
  selectMood('');
  renderDiaryList();
}

// 写入 Obsidian Vault（My-Vault/02-日记/）
function sendToObsidian() {
  const text = document.getElementById('diary-input').value.trim();
  if (!text) { alert(t('alertWriteFirst')); return; }

  const now = new Date();
  const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const timeStr = now.toLocaleTimeString(localeStr(), { hour:'2-digit', minute:'2-digit' });
  const moodStr = selectedMood || '📝';

  let baziLine = '';
  if (typeof Lunar !== 'undefined') {
    const bazi = getBaziForDate(now);
    baziLine = currentLang === 'en'
      ? `Y ${bazi.year.tg}${bazi.year.dz} · M ${bazi.month.tg}${bazi.month.dz} · D ${bazi.day.tg}${bazi.day.dz} · H ${bazi.hour.tg}${bazi.hour.dz}`
      : `${bazi.year.tg}${bazi.year.dz}年 · ${bazi.month.tg}${bazi.month.dz}月 · ${bazi.day.tg}${bazi.day.dz}日 · ${bazi.hour.tg}${bazi.hour.dz}时`;
  }

  // Markdown 内容（带 frontmatter）
  const tagJournal = t('obsidianMdTagJournal');
  const tagApp = t('obsidianMdTagApp');
  const moodTitle = t('obsidianMdMood');
  const recordTimeLabel = t('obsidianMdRecordTime');
  const mdContent = `---
date: ${dateStr}
time: ${timeStr}
mood: ${moodStr}
bazi: ${baziLine}
tags: [${tagJournal}, ${tagApp}]
---

# ${dateStr} ${moodTitle} ${moodStr}

> ${baziLine}
> ${recordTimeLabel}：${timeStr}

${text}
`;

  // 构造 Obsidian URI
  const vault = encodeURIComponent('Nami');
  const filePath = encodeURIComponent(`My-Vault/02-日记/${dateStr}`);
  const content = encodeURIComponent(mdContent);
  const uri = `obsidian://new?vault=${vault}&file=${filePath}&content=${content}`;

  if (uri.length > 7500) {
    navigator.clipboard.writeText(mdContent).then(() => {
      alert(t('obsidianAlertLong'));
      const fallbackUri = `obsidian://new?vault=${vault}&file=${filePath}`;
      window.location.href = fallbackUri;
    }).catch(() => {
      alert(t('obsidianAlertFail'));
    });
    return;
  }

  saveDiary();
  window.location.href = uri;
}

function renderDiaryList() {
  const esc = (x) => String(x).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  document.getElementById('diary-list').innerHTML = diaryEntries.length
    ? diaryEntries.map(e => `<div class="entry">
        <div class="row between"><span>${e.mood} ${esc(e.date)} ${esc(e.time)}</span><span class="mute small">${esc(e.bazi)}</span></div>
        <p>${esc(e.text)}</p></div>`).join('')
    : `<div class="empty mute">${t('noDiary')}</div>`;
}

function exportDiary() {
  const content = diaryEntries.map(e =>
    `【${e.date} ${e.time}】${e.mood}\n${currentLang==='en'?'BaZi':'八字'}：${e.bazi}\n${e.text}\n${'─'.repeat(30)}`
  ).join('\n\n');
  const blob = new Blob([content || (currentLang==='en'?'No journal entries yet':'暂无日记记录')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${t('diaryFilenameBase')}_${new Date().toLocaleDateString('sv')}.txt`;
  a.click();
}

function clearData() {
  if (confirm(t('confirmClear'))) {
    try { localStorage.removeItem('diary_entries'); } catch(e) {}
    diaryEntries = [];
    renderDiaryList();
  }
}

// 诊断：扫描 localStorage 找回旧版日记
function diagnoseDiary() {
  const resultEl = document.getElementById('diagnose-result');
  resultEl.hidden = false;

  const allKeys = [];
  const legacyKeys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    allKeys.push(k);
    if (k && k.startsWith('panna_j_')) legacyKeys.push(k);
  }

  const currentCount = diaryEntries.length;
  const host = location.hostname;

  let html = `<div>`;
  html += `<div>${t('diagnoseTitle')}</div>`;
  html += `<div>${t('currentUrl')}：<span class="mute">${host}</span></div>`;
  html += `<div>${t('totalKeys')}：<strong>${allKeys.length}</strong></div>`;
  html += `<div>${t('newDiaryCount')}：<strong>${currentCount}</strong></div>`;
  html += `<div>${t('legacyDiaryCount')}：<strong class="${legacyKeys.length>0?'ok':'no'}">${legacyKeys.length}</strong></div>`;

  if (legacyKeys.length > 0) {
    html += `<div style="margin-top:8px">`;
    html += `<div class="ok">${t('legacyFound')}</div>`;
    html += `<button class="btn" onclick="recoverLegacyDiary()">${t('recoverBtn')}</button>`;
    html += ` <button class="link" onclick="exportLegacyRaw()">${t('exportRawBtn')}</button>`;
    html += `</div>`;
  } else {
    html += `<div class="no" style="margin-top:8px">`;
    html += `${t('legacyNotFound')}<br><br>`;
    html += `<strong>${t('possibleReasons')}</strong><br>`;
    html += `${t('reason1')}<br>`;
    html += `${t('reason2')}<br>`;
    html += `${t('reason3')}<br><br>`;
    html += `${t('suggestion')}`;
    html += `</div>`;
  }

  if (allKeys.length > 0) {
    html += `<details><summary>${t('viewAllKeys')}（${allKeys.length}）</summary>`;
    html += `<div style="font-family:monospace">${allKeys.join('<br>')}</div>`;
    html += `</details>`;
  }

  html += `</div>`;
  resultEl.innerHTML = html;
}

// 一键恢复：把扫描到的 panna_j_* 数据迁移到 diary_entries
function recoverLegacyDiary() {
  diaryEntries = migrateLegacyDiary();
  renderDiaryList();
  alert(t('recoverDone').replace('{n}', diaryEntries.length));
  diagnoseDiary();
}

// 导出原始 panna_j_* 数据为文本
function exportLegacyRaw() {
  let txt = t('legacyExportTitle') + '\n\n';
  const items = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith('panna_j_')) {
      const dateStr = k.replace('panna_j_', '');
      const text = localStorage.getItem(k);
      items.push({ dateStr, text });
    }
  }
  items.sort((a, b) => {
    const da = new Date(a.dateStr); const db = new Date(b.dateStr);
    return db - da;
  });
  items.forEach(it => {
    txt += `[${it.dateStr}]\n${it.text}\n\n${'─'.repeat(30)}\n\n`;
  });

  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${t('legacyFilenameBase')}_${new Date().toLocaleDateString('sv')}.txt`;
  a.click();
}

// ===== CLOCK =====
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString(localeStr(), { month:'numeric', day:'numeric' }) + ' ' +
    now.toLocaleTimeString(localeStr(), { hour:'2-digit', minute:'2-digit', hour12:false });
}

// ===== TAB SWITCHING =====
// Updated signature to accept event explicitly (HTML now passes it). Also tolerate old global event for safety.
// 每个页面一个网址：#now #yiji #astro #ziwei #jiugong #diary #settings
const VIEWS = ['now', 'yiji', 'astro', 'ziwei', 'jiugong', 'diary', 'settings'];
function route() {
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'now';
  VIEWS.forEach(id => { document.getElementById(id).hidden = id !== v; });
  document.querySelectorAll('header a').forEach(a => a.toggleAttribute('aria-current', a.hash === '#' + v));
}

// ===== INIT =====
function init() {
  applyStaticI18n();
  syncTheme();
  route();
  addEventListener('hashchange', () => { route(); scrollTo(0, 0); });
  detectTimezone();
  updateClock();
  setInterval(updateClock, 1000);
  if (typeof Lunar === 'undefined') return;
  renderBazi();
  renderAstrology();
  renderCalendar();
  renderJiugong();
  renderZiwei();
  initDiary();
  setInterval(renderBazi, 60000);
}

window.addEventListener('DOMContentLoaded', init);
